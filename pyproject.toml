[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-kg"
version = "0.1.0"
description = "Staged CLI pipeline: construction PDFs → structured entities → Neo4j knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "PyMuPDF>=1.23",
    "pyyaml>=6.0",
    "neo4j>=5.14",
    "httpx>=0.25",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
blueprint-kg = "blueprint_kg.cli:cli"

[tool.setuptools.packages.find]
include = ["blueprint_kg*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["blueprint_kg/tests"]